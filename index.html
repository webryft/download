<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Download</title>
<style>
  :root{
    --bg:#000000;
    --panel:#0d0d0f;
    --line:rgba(255,255,255,0.08);
    --text:#f5f5f7;
    --muted:#8b8b92;
    --grad: linear-gradient(120deg,#7c5cff,#22d3ee);
    --ease: cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    overflow:hidden;
  }
  .page{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* subtle ambient glow */
  .glow{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 50% 30%, rgba(124,92,255,.10), transparent 60%),
      radial-gradient(50% 40% at 60% 80%, rgba(34,211,238,.08), transparent 60%);
  }

  /* download card */
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    animation:fadeUp .6s var(--ease) both;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  .image-wrap{
    width:180px;height:180px;
    border-radius:28px;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    transition:transform .28s var(--ease), border-color .28s var(--ease), box-shadow .28s var(--ease);
    box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  .card:hover .image-wrap{
    transform:translateY(-4px) scale(1.02);
    border-color:rgba(255,255,255,.2);
    box-shadow:0 26px 70px rgba(124,92,255,.18);
  }
  .card:active .image-wrap{ transform:scale(.97); }
  .image-wrap img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .image-wrap .fallback-icon{ color:var(--muted); display:none; }
  .image-wrap .fallback-icon svg{ width:56px;height:56px; }

  .title-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .title-row svg{
    width:22px;height:22px;
    color:transparent;
    background:var(--grad);
    -webkit-mask: var(--mask, none) center / contain no-repeat;
  }
  .title{
    font-size:22px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .subtitle{
    font-size:13px;
    color:var(--muted);
    margin-top:-10px;
    text-align:center;
  }

  .dl-icon{ width:22px;height:22px; }
  .dl-icon svg{ width:100%;height:100%; }
  .dl-icon .grad-stop-a{ stop-color:#7c5cff }
  .dl-icon .grad-stop-b{ stop-color:#22d3ee }

  /* invisible trigger button, top-left corner */
  .hidden-trigger{
    position:fixed;
    top:0;left:0;
    width:46px;height:46px;
    background:transparent;
    border:none;
    z-index:50;
    cursor:default;
    padding:0;
    opacity:0;
  }

  /* loading overlay */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.86);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s var(--ease);
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .overlay-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    transform:translateY(10px);
    opacity:0;
    transition:transform .4s var(--ease), opacity .4s var(--ease);
  }
  .overlay.show .overlay-inner{ transform:none; opacity:1; }

  .ring-wrap{
    width:64px;height:64px;
    position:relative;
  }
  .ring{
    position:absolute;inset:0;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:#7c5cff;
    border-right-color:#22d3ee;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .overlay-label{
    font-size:14px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ============================================================
     CONFIG — edit these two links if they ever change
     ============================================================ -->
<script>
  const DOWNLOAD_URL = "https://drive.google.com/file/d/1ahspqC3cAinDGHgx4MlVTEpibtPnkpnr/view?usp=drivesdk";
  const SECRET_URL   = "https://flow.google.com/";
  const SECRET_CLICKS_REQUIRED = 50;
</script>

<div class="glow"></div>

<div class="page">
  <button class="card" id="downloadCard" aria-label="Download">
    <div class="image-wrap">
      <img src="image.png" alt="" id="cardImg" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <div class="fallback-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="9" cy="9" r="1.6"/>
          <path d="M21 15l-5.5-5.5L5 20"/>
        </svg>
      </div>
    </div>
    <div class="title-row">
      <span class="dl-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="dlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" class="grad-stop-a"/>
              <stop offset="100%" class="grad-stop-b"/>
            </linearGradient>
          </defs>
          <path d="M12 3v13m0 0-4.5-4.5M12 16l4.5-4.5" stroke="url(#dlGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 19h16" stroke="url(#dlGrad)" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="title">Download</span>
    </div>
    <div class="subtitle">Tap to get the file</div>
  </button>
</div>

<!-- invisible easter-egg trigger, top-left corner -->
<button class="hidden-trigger" id="secretTrigger" aria-hidden="true" tabindex="-1"></button>

<!-- loading overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="ring-wrap"><div class="ring"></div></div>
    <div class="overlay-label" id="overlayLabel">Redirecting…</div>
  </div>
</div>

<script>
  /* main download action */
  document.getElementById('downloadCard').addEventListener('click', ()=>{
    window.location.href = DOWNLOAD_URL;
  });

  /* hidden 50-click trigger */
  let secretCount = 0;
  const overlay = document.getElementById('overlay');
  const overlayLabel = document.getElementById('overlayLabel');

  document.getElementById('secretTrigger').addEventListener('click', ()=>{
    secretCount++;
    if(secretCount >= SECRET_CLICKS_REQUIRED){
      overlay.classList.add('show');
      let dots = 0;
      const iv = setInterval(()=>{
        dots = (dots + 1) % 4;
        overlayLabel.textContent = 'Redirecting' + '.'.repeat(dots);
      }, 350);
      setTimeout(()=>{
        clearInterval(iv);
        window.location.href = SECRET_URL;
      }, 1600);
    }
  });
</script>
</body>
</html>
